# Mellow-Video-Engine Configuration
# ===================================

# Project Settings
project:
  name: "Mellow-Video-Engine"
  version: "0.1.0"
  assets_dir: "./assets"
  temp_dir: "./assets/temp"

# Model Paths (Local)
models:
  whisper:
    model_size: "large-v3"  # tiny, base, small, medium, large-v2, large-v3
    device: "cuda"
    compute_type: "float16"

  llm:
    provider: "ollama"  # ollama, vllm
    model_name: "qwen2.5:7b"
    base_url: "http://localhost:11434"
    temperature: 0.7
    max_tokens: 2048

# ComfyUI API Settings
comfyui:
  host: "127.0.0.1"
  port: 8188
  use_ssl: false
  timeout: 300  # seconds

  # Default workflow settings
  image_generation:
    model: "flux1-dev-Q3_K_S.gguf"
    width: 1216
    height: 684
    steps: 20
    cfg_scale: 7.5
    sampler: "euler"
    scheduler: "normal"

  video_generation:
    model: "ltx-video"  # svd, ltx-video
    frames: 49
    fps: 24
    motion_bucket_id: 127

# FFmpeg Settings
ffmpeg:
  path: "D:/Mellow-Video-Engine/.venv/Scripts/ffmpeg.exe"
  video_codec: "libx264"
  audio_codec: "aac"
  video_bitrate: "5000k"
  audio_bitrate: "192k"
  preset: "medium"

  # Output format
  output:
    format: "mp4"
    resolution: "1920x1080"
    fps: 30

# Font Settings for Overlays
fonts:
  title:
    path: "./assets/fonts/NotoSansKR-Bold.ttf"
    size: 72
    color: "white"
  subtitle:
    path: "./assets/fonts/NotoSansKR-Regular.ttf"
    size: 36
    color: "white"
  lyrics:
    path: "./assets/fonts/NotoSansKR-Medium.ttf"
    size: 48
    color: "white"
    outline_color: "black"
    outline_width: 2

# YouTube API Settings
youtube:
  client_secrets_file: "./config/client_secrets.json"
  credentials_file: "./config/youtube_credentials.json"
  scopes:
    - "https://www.googleapis.com/auth/youtube.upload"
    - "https://www.googleapis.com/auth/youtube"

# Localization Settings
localization:
  source_language: "ko"
  target_languages:
    - "en"
    - "ja"
    - "zh-CN"

# VRAM Management
vram:
  max_usage_gb: 16
  unload_after_use: true
  gc_aggressive: true

# Logging
logging:
  level: "INFO"
  file: "./logs/mellow.log"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Unified maintained runtime outputs
outputs:
  root: "./outputs"
  uploads_dir: "uploads"
  transcripts_dir: "transcripts"
  images_dir: "images"
  videos_dir: "videos"
  final_dir: "final"
  strip_prompt_metadata: false

video:
  default_mode: "LOCAL_MOTION_LOOP"
  backend: "minimax_h3"
  minimax_h3:
    workflow: "video_minimax_h3_i2v.json"
    megapixels: 0.4
    fps: 24
    duration_seconds: 5.0
  locked_camera_mode: true
  locked_camera_backend: "ambient_loop"
  locked_camera_workflow: "svd_xt_locked_camera.json"
  stabilize_zoom_drift: true
  stabilization_strength: 0.18
  ambient_motion_strength: 0.34
  ambient_loop:
    debug_visualization: true
    visibility_mode: "visibility_first"
    min_patch_alpha: 0.22
    min_patch_shift_px: 14.0
    min_light_pulse: 0.75
  motion_bucket_id_locked: 1
  augmentation_level_locked: 0.0
  video_frames_locked: 21
  raw_fps_locked: 7
  output_fps: 8
  sampler_steps_locked: 14
  sampler_cfg_locked: 1.5
  motion_video:
    workflow: "ltx_2b_v0_9_ckpt_i2v_lowmem.json"
    width: 576
    height: 320
    frames: 17
    fps: 6
    duration_seconds: 2.83
  motion_video_spike:
    engine: "ltx_local_2b_v0_9"
    enabled: true
    workflow: "ltx_2b_v0_9_ckpt_i2v_lowmem.json"
    comfy_root: "D:/AI_Hub/Models/ComfyUI_windows_portable/ComfyUI"
    model_file: "ltx-video-2b-v0.9.safetensors"
    model_search_dirs:
      - "models/unet"
      - "models/diffusion_models"
      - "models/checkpoints"
    clip_file: "t5xxl_fp16.safetensors"
    vae_file: "ae.safetensors"
    width: 576
    height: 320
    length: 17
    fps: 6
    duration_seconds: 2.83
    steps: 20
    cfg: 3.0
    sampler: "euler"
    scheduler: "simple"
    strength: 0.75
    unet_weight_dtype: "fp8_e4m3fn_fast"
    clip_device: "cpu"
    reserve_vram_gb: 4
