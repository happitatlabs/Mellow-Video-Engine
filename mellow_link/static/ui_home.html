<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mellow-Link Modules</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[radial-gradient(circle_at_top,_#0f172a,_#020617_60%)] text-slate-100">
    <div class="max-w-6xl mx-auto px-6 py-8">
        <header class="flex flex-wrap items-center justify-between gap-4 mb-8">
            <div>
                <p class="text-xs uppercase tracking-[0.25em] text-cyan-300/80">Mellow-Link</p>
                <h1 class="text-4xl font-semibold mt-2">Executable AI Platform</h1><p class="mt-3 inline-flex rounded-full border border-sky-300/20 bg-sky-400/10 px-3 py-1 text-xs uppercase tracking-[0.2em] text-sky-200">Default Entry: Runtime Chat</p>
                <p class="text-slate-400 mt-2">엔진은 공통으로 유지하고, 시작점은 모듈 단위로 분리합니다.</p>
            </div>
            <nav class="flex flex-wrap gap-2 text-sm">
                <a href="/runs" class="px-4 py-2 rounded-full border border-white/10 hover:bg-white/5">Runs</a>
                <a href="/runtime-console" class="px-4 py-2 rounded-full border border-white/10 hover:bg-white/5">Runtime Chat</a>
                <a href="/runtime-operator" class="px-4 py-2 rounded-full border border-white/10 hover:bg-white/5">Runtime Ops</a>
                <a href="/user-console" class="px-4 py-2 rounded-full border border-white/10 hover:bg-white/5">Run Console</a>
            </nav>
        </header>

        <section class="rounded-3xl border border-white/10 bg-slate-900/50 p-6 mb-6">
            <div class="flex flex-wrap items-center justify-between gap-4">
                <div>
                    <h2 class="text-xl font-medium">로그인</h2>
                    <p id="authStatus" class="text-sm text-slate-400 mt-1">로그인 상태를 확인하는 중입니다.</p>
                </div>
                <div class="flex gap-2 text-sm">
                    <a href="/index.html" class="px-4 py-2 rounded-full border border-white/10 hover:bg-white/5">Legacy Chat (Deprecated)</a>
                    <button id="logoutBtn" class="hidden px-4 py-2 rounded-full border border-white/10 hover:bg-white/5">Logout</button>
                </div>
            </div>
            <div id="loginPanel" class="grid md:grid-cols-[1fr_1fr_auto] gap-3 mt-4">
                <input id="loginUsername" type="text" placeholder="Username" class="rounded-xl bg-slate-950/70 border border-white/10 px-4 py-3 text-sm" />
                <input id="loginPassword" type="password" placeholder="Password" class="rounded-xl bg-slate-950/70 border border-white/10 px-4 py-3 text-sm" />
                <button id="loginBtn" class="px-4 py-3 rounded-xl bg-cyan-400 text-slate-950 font-medium hover:bg-cyan-300">Login</button>
            </div>
            <div id="authError" class="hidden mt-3 text-sm text-rose-300"></div>
        </section>

        <section class="rounded-3xl border border-white/10 bg-slate-900/50 p-6">
            <div class="flex items-center justify-between gap-4 mb-6">
                <div>
                    <h2 class="text-2xl font-medium">Modules</h2>
                    <p class="text-sm text-slate-400 mt-1">모듈 시작 UI와 run 콘솔은 유지하고, Runtime Chat/Ops는 `/runtime/*` 계약만 사용합니다.</p>
                </div>
            </div>
            <div id="moduleGrid" class="grid md:grid-cols-2 xl:grid-cols-3 gap-5">
                <div class="rounded-2xl border border-white/10 bg-slate-950/40 p-5 text-slate-500">모듈 로딩 중...</div>
            </div>
        </section>
    </div>

    <script>
        function getStoredToken() {
            return localStorage.getItem('authToken') || localStorage.getItem('auth_token') || '';
        }
        function setStoredToken(token) {
            if (token) {
                localStorage.setItem('authToken', token);
                localStorage.setItem('auth_token', token);
            } else {
                localStorage.removeItem('authToken');
                localStorage.removeItem('auth_token');
            }
        }
        function setAuthState(message, isError) {
            const status = document.getElementById('authStatus');
            const error = document.getElementById('authError');
            if (status) {
                status.className = 'text-sm mt-1 ' + (isError ? 'text-rose-300' : 'text-slate-400');
                status.textContent = message;
            }
            if (error) {
                if (isError) {
                    error.classList.remove('hidden');
                    error.textContent = message;
                } else {
                    error.classList.add('hidden');
                    error.textContent = '';
                }
            }
        }
        async function refreshAuthState() {
            const token = getStoredToken();
            const panel = document.getElementById('loginPanel');
            const logoutBtn = document.getElementById('logoutBtn');
            if (!token) {
                if (panel) panel.classList.remove('hidden');
                if (logoutBtn) logoutBtn.classList.add('hidden');
                setAuthState('로그인되어 있지 않습니다. 실행 목록과 모듈 run 생성은 로그인이 필요합니다.', false);
                return;
            }
            try {
                const res = await fetch('/auth/me', {
                    headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/json' }
                });
                if (!res.ok) {
                    setStoredToken('');
                    if (panel) panel.classList.remove('hidden');
                    if (logoutBtn) logoutBtn.classList.add('hidden');
                    setAuthState('로그인 세션이 유효하지 않습니다. 다시 로그인하세요.', true);
                    return;
                }
                const user = await res.json();
                if (panel) panel.classList.add('hidden');
                if (logoutBtn) logoutBtn.classList.remove('hidden');
                setAuthState('로그인됨: ' + (user.username || 'user') + ' (' + (user.role || 'user') + ')', false);
            } catch (e) {
                setAuthState('인증 상태를 확인하지 못했습니다.', true);
            }
        }
        async function login() {
            const username = (document.getElementById('loginUsername').value || '').trim();
            const password = document.getElementById('loginPassword').value || '';
            if (!username || !password) {
                setAuthState('사용자명과 비밀번호를 입력하세요.', true);
                return;
            }
            const form = new URLSearchParams();
            form.set('username', username);
            form.set('password', password);
            try {
                const res = await fetch('/auth/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: form.toString()
                });
                const payload = await res.json().catch(function () { return {}; });
                if (!res.ok) {
                    setAuthState(payload.detail || '로그인 실패', true);
                    return;
                }
                setStoredToken(payload.access_token || '');
                document.getElementById('loginPassword').value = '';
                await refreshAuthState();
            } catch (e) {
                setAuthState('로그인 요청 실패', true);
            }
        }
        async function loadModules() {
            const res = await fetch('/api/modules', { headers: { 'Accept': 'application/json' } });
            const data = await res.json();
            const modules = data.modules || [];
            const grid = document.getElementById('moduleGrid');
            grid.innerHTML = modules.map(function (module) {
                return '<a href="' + module.start_path + '" class="block rounded-3xl border border-white/10 bg-slate-950/50 p-5 hover:bg-white/5 transition-colors">' +
                    '<div class="flex items-center justify-between gap-4">' +
                    '<span class="inline-flex h-12 w-12 items-center justify-center rounded-2xl bg-cyan-400/10 text-cyan-300 font-semibold">' + (module.icon || '[]') + '</span>' +
                    '<span class="text-xs uppercase tracking-[0.2em] text-slate-500">' + (module.run_kind || '-') + '</span>' +
                    '</div>' +
                    '<h3 class="text-xl font-medium mt-5">' + module.name + '</h3>' +
                    '<p class="text-sm text-slate-400 mt-2 leading-6">' + module.description + '</p>' +
                    '<div class="mt-5 text-sm text-cyan-300">Open Module</div>' +
                    '</a>';
            }).join('');
        }
        loadModules().catch(function () {
            document.getElementById('moduleGrid').innerHTML = '<div class="rounded-2xl border border-rose-500/20 bg-rose-500/10 p-5 text-rose-200">모듈 목록을 불러오지 못했습니다.</div>';
        });
        document.getElementById('loginBtn').addEventListener('click', login);
        document.getElementById('loginPassword').addEventListener('keydown', function (event) {
            if (event.key === 'Enter') login();
        });
        document.getElementById('logoutBtn').addEventListener('click', function () {
            setStoredToken('');
            refreshAuthState();
        });
        refreshAuthState();
    </script>
</body>
</html>
