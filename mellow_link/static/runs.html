<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runs | Mellow-Link</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
    <div class="max-w-6xl mx-auto px-6 py-8">
        <header class="flex flex-wrap items-center justify-between gap-4 mb-8">
            <div>
                <p class="text-xs uppercase tracking-[0.25em] text-cyan-300/80">Runs</p>
                <h1 class="text-3xl font-semibold mt-2">최근 실행 목록</h1>
                <p class="text-slate-400 mt-2">run_id를 중심으로 사용자 실행 뷰로 이동합니다.</p>
            </div>
            <nav class="flex flex-wrap gap-2 text-sm">
                <a href="/ui" class="px-4 py-2 rounded-full border border-white/10 hover:bg-white/5">Home</a>
                <a href="/user-console" class="px-4 py-2 rounded-full border border-white/10 hover:bg-white/5">User Console</a>
                <a href="/dev-dashboard" class="px-4 py-2 rounded-full border border-white/10 hover:bg-white/5">Dev Dashboard</a>
            </nav>
        </header>

        <section class="rounded-3xl border border-white/10 bg-slate-900/60 p-5">
            <div class="grid md:grid-cols-[1fr_auto_auto_auto_auto] gap-3 mb-5">
                <input id="searchInput" type="text" placeholder="run_id 검색" class="rounded-xl bg-slate-950/70 border border-white/10 px-4 py-3 text-sm focus:outline-none focus:border-cyan-400/40">
                <select id="statusFilter" class="rounded-xl bg-slate-950/70 border border-white/10 px-4 py-3 text-sm">
                    <option value="">모든 상태</option>
                    <option value="pending">pending</option>
                    <option value="running">running</option>
                    <option value="completed">completed</option>
                    <option value="failed">failed</option>
                </select>
                <select id="moduleFilter" class="rounded-xl bg-slate-950/70 border border-white/10 px-4 py-3 text-sm">
                    <option value="">모든 모듈</option>
                </select>
                <select id="kindFilter" class="rounded-xl bg-slate-950/70 border border-white/10 px-4 py-3 text-sm">
                    <option value="">모든 실행 유형</option>
                </select>
                <button id="refreshBtn" class="rounded-xl bg-cyan-400 px-4 py-3 text-sm font-medium text-slate-950 hover:bg-cyan-300">새로고침</button>
            </div>

            <div id="runsMeta" class="text-xs text-slate-500 mb-4">로딩 중...</div>
            <div id="runsTable" class="space-y-3"></div>
        </section>
    </div>

    <script>
        const API = window.location.origin;
        let runs = [];

        function authHeaders() {
            const token = localStorage.getItem('authToken') || localStorage.getItem('auth_token');
            const headers = { 'Accept': 'application/json' };
            if (token) headers['Authorization'] = 'Bearer ' + token;
            return headers;
        }

        function render() {
            const q = (document.getElementById('searchInput').value || '').toLowerCase();
            const status = document.getElementById('statusFilter').value;
            const moduleId = document.getElementById('moduleFilter').value;
            const runKind = document.getElementById('kindFilter').value;
            const filtered = runs.filter(function (run) {
                const hitQ = !q || (run.run_id || '').toLowerCase().includes(q);
                const hitStatus = !status || run.status === status;
                const hitModule = !moduleId || (run.module_id || '') === moduleId;
                const hitKind = !runKind || (run.run_kind || '') === runKind;
                return hitQ && hitStatus && hitModule && hitKind;
            });
            document.getElementById('runsMeta').textContent = filtered.length + '개 run';
            const container = document.getElementById('runsTable');
            if (!filtered.length) {
                container.innerHTML = '<div class="rounded-2xl border border-dashed border-white/10 px-5 py-8 text-center text-slate-500">조건에 맞는 run이 없습니다.</div>';
                return;
            }
            container.innerHTML = filtered.map(function (run) {
                const createdAt = run.created_at ? new Date(run.created_at).toLocaleString() : '-';
                const duration = run.processing_time != null ? (run.processing_time + ' ms') : '-';
                return '<a href="/user-console?run_id=' + encodeURIComponent(run.run_id) + '" class="block rounded-2xl border border-white/8 bg-slate-950/40 px-5 py-4 hover:bg-white/5">' +
                    '<div class="flex flex-wrap items-center justify-between gap-3">' +
                    '<div><div class="font-mono text-sm text-cyan-300">' + run.run_id + '</div><div class="text-xs text-slate-500 mt-1">' + createdAt + '</div></div>' +
                    '<div class="flex flex-wrap gap-2 text-xs">' +
                    '<span class="px-2 py-1 rounded-full border border-white/10">' + (run.status || '-') + '</span>' +
                    '<span class="px-2 py-1 rounded-full border border-white/10">' + (run.module_id || 'engine') + '</span>' +
                    '<span class="px-2 py-1 rounded-full border border-white/10">' + (run.run_kind || 'generic') + '</span>' +
                    '<span class="px-2 py-1 rounded-full border border-white/10">mode ' + (run.selected_mode || '-') + '</span>' +
                    '<span class="px-2 py-1 rounded-full border border-white/10">' + duration + '</span>' +
                    '</div></div>' +
                    '<div class="text-sm text-slate-300 mt-3">' + ((run.summary || '').slice(0, 160) || '요약 없음') + '</div>' +
                    '</a>';
            }).join('');
        }

        async function loadRuns() {
            const res = await fetch(API + '/runs?limit=100', { headers: authHeaders() });
            if (!res.ok) {
                if (res.status === 401) throw new Error('로그인 후 내 run 목록을 볼 수 있습니다.');
                throw new Error('load failed');
            }
            const data = await res.json();
            runs = data.runs || [];
            const moduleFilter = document.getElementById('moduleFilter');
            const kindFilter = document.getElementById('kindFilter');
            const modules = Array.from(new Set(runs.map(function (r) { return r.module_id || 'engine'; }))).sort();
            const kinds = Array.from(new Set(runs.map(function (r) { return r.run_kind || 'generic'; }))).sort();
            moduleFilter.innerHTML = '<option value="">모든 모듈</option>' + modules.map(function (m) { return '<option value="' + m + '">' + m + '</option>'; }).join('');
            kindFilter.innerHTML = '<option value="">모든 실행 유형</option>' + kinds.map(function (k) { return '<option value="' + k + '">' + k + '</option>'; }).join('');
            render();
        }

        document.getElementById('searchInput').addEventListener('input', render);
        document.getElementById('statusFilter').addEventListener('change', render);
        document.getElementById('moduleFilter').addEventListener('change', render);
        document.getElementById('kindFilter').addEventListener('change', render);
        document.getElementById('refreshBtn').addEventListener('click', function () { loadRuns().catch(console.warn); });
        loadRuns().catch(function () {
            document.getElementById('runsMeta').textContent = '불러오기 실패';
            document.getElementById('runsTable').innerHTML = '<div class="rounded-2xl border border-rose-500/20 bg-rose-500/10 px-5 py-6 text-rose-200">run 목록을 불러오지 못했습니다. 로그인 상태와 권한을 확인하세요.</div>';
        });
    </script>
</body>
</html>
