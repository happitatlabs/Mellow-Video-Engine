<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
    <div class="max-w-4xl mx-auto px-6 py-10">
        <a href="/ui" class="text-sm text-emerald-300 hover:text-emerald-200">Home</a>
        <h1 class="text-3xl font-semibold mt-4">Research Assistant</h1>
        <p class="text-slate-400 mt-2">문서를 업로드하고, 그 문서를 기준으로 리서치/정리 run을 시작합니다.</p>
        <div class="mt-6 rounded-3xl border border-white/10 bg-slate-900/60 p-6 space-y-4">
            <div class="rounded-2xl border border-white/10 bg-slate-950/40 p-4 space-y-3">
                <div class="flex items-center justify-between gap-3">
                    <div>
                        <div class="text-sm font-medium text-slate-200">인증 상태</div>
                        <div id="authStatus" class="mt-1 text-xs text-amber-300">로그인이 필요합니다.</div>
                    </div>
                    <a href="/index.html" class="text-xs text-cyan-300 hover:text-cyan-200">기존 로그인 화면</a>
                </div>
                <div id="loginPanel" class="grid md:grid-cols-[1fr_1fr_auto] gap-3">
                    <input id="loginUsername" type="text" placeholder="Username" class="rounded-xl bg-slate-950/70 border border-white/10 px-4 py-3 text-sm" />
                    <input id="loginPassword" type="password" placeholder="Password" class="rounded-xl bg-slate-950/70 border border-white/10 px-4 py-3 text-sm" />
                    <button id="loginBtn" class="px-4 py-3 rounded-xl bg-cyan-400 text-slate-950 font-medium hover:bg-cyan-300">Login</button>
                </div>
                <div id="authError" class="hidden text-xs text-rose-400"></div>
            </div>
            <div class="rounded-2xl border border-dashed border-white/10 bg-slate-950/40 p-4">
                <label for="fileInput" class="block text-sm font-medium text-slate-200">문서 업로드</label>
                <p class="mt-1 text-xs text-slate-500">기존 임시 업로드 경로를 재사용합니다. 업로드한 문서는 이번 분석 시작점에서만 사용됩니다.</p>
                <input id="fileInput" type="file" multiple class="mt-3 block w-full text-sm text-slate-300 file:mr-4 file:rounded-xl file:border-0 file:bg-emerald-400 file:px-4 file:py-2 file:font-medium file:text-slate-950 hover:file:bg-emerald-300" />
                <button id="uploadBtn" class="mt-3 px-4 py-2 rounded-xl border border-white/10 bg-slate-800 text-sm font-medium hover:bg-slate-700">Upload Documents</button>
                <div id="uploadStatus" class="mt-3 text-xs text-slate-400">업로드한 문서가 없습니다.</div>
            </div>
            <textarea id="question" rows="6" class="w-full rounded-2xl bg-slate-950/70 border border-white/10 px-4 py-3 text-sm" placeholder="분석하고 싶은 질문"></textarea>
            <textarea id="contextNote" rows="4" class="w-full rounded-2xl bg-slate-950/70 border border-white/10 px-4 py-3 text-sm" placeholder="추가 문맥 또는 문서 메모"></textarea>
            <button id="startBtn" class="px-5 py-3 rounded-xl bg-emerald-400 text-slate-950 font-medium hover:bg-emerald-300">Start Research Run</button>
        </div>
    </div>
    <script>
        const uploadSessionId = (window.crypto && typeof window.crypto.randomUUID === 'function')
            ? window.crypto.randomUUID()
            : ('research-' + Date.now());
        const uploadedFiles = [];

        function getStoredToken() {
            return localStorage.getItem('authToken') || localStorage.getItem('auth_token') || '';
        }
        function setStoredToken(token) {
            if (token) {
                localStorage.setItem('authToken', token);
                localStorage.setItem('auth_token', token);
            } else {
                localStorage.removeItem('authToken');
                localStorage.removeItem('auth_token');
            }
        }
        function authHeaders(extra) {
            const token = getStoredToken();
            const headers = Object.assign({}, extra || {});
            if (token) headers['Authorization'] = 'Bearer ' + token;
            return headers;
        }
        function setAuthMessage(message, isError) {
            const status = document.getElementById('authStatus');
            const error = document.getElementById('authError');
            if (status) {
                status.className = 'mt-1 text-xs ' + (isError ? 'text-rose-300' : 'text-emerald-300');
                status.textContent = message;
            }
            if (error) {
                if (isError) {
                    error.classList.remove('hidden');
                    error.textContent = message;
                } else {
                    error.classList.add('hidden');
                    error.textContent = '';
                }
            }
        }
        function updateAuthUI() {
            const token = getStoredToken();
            const panel = document.getElementById('loginPanel');
            if (token) {
                if (panel) panel.classList.add('hidden');
                setAuthMessage('로그인됨. 문서 기반 분석 run을 생성할 수 있습니다.', false);
            } else {
                if (panel) panel.classList.remove('hidden');
                setAuthMessage('로그인이 필요합니다. 아래에서 로그인하거나 기존 로그인 화면을 사용하세요.', false);
            }
        }
        async function login() {
            const username = (document.getElementById('loginUsername').value || '').trim();
            const password = document.getElementById('loginPassword').value || '';
            if (!username || !password) {
                setAuthMessage('사용자명과 비밀번호를 입력하세요.', true);
                return;
            }
            const form = new URLSearchParams();
            form.set('username', username);
            form.set('password', password);
            try {
                const res = await fetch('/auth/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: form.toString()
                });
                const payload = await res.json().catch(function () { return {}; });
                if (!res.ok) {
                    setAuthMessage(payload.detail || '로그인 실패', true);
                    return;
                }
                setStoredToken(payload.access_token || '');
                setAuthMessage('로그인 성공', false);
                document.getElementById('loginPassword').value = '';
                updateAuthUI();
            } catch (e) {
                setAuthMessage('로그인 요청 실패', true);
            }
        }
        function renderUploadStatus(message, isError) {
            const el = document.getElementById('uploadStatus');
            if (!el) return;
            el.className = 'mt-3 text-xs ' + (isError ? 'text-rose-400' : 'text-slate-400');
            const filesText = uploadedFiles.length ? ('업로드됨: ' + uploadedFiles.join(', ')) : '업로드한 문서가 없습니다.';
            el.textContent = message ? (message + ' / ' + filesText) : filesText;
        }
        document.getElementById('uploadBtn').addEventListener('click', async function () {
            const input = document.getElementById('fileInput');
            const files = Array.from((input && input.files) || []);
            if (!files.length) {
                renderUploadStatus('먼저 업로드할 문서를 선택하세요.', true);
                return;
            }
            renderUploadStatus('문서 업로드 중...', false);
            for (const file of files) {
                const form = new FormData();
                form.append('file', file);
                form.append('session_id', uploadSessionId);
                const res = await fetch('/chat/upload-temp', {
                    method: 'POST',
                    headers: authHeaders(),
                    body: form
                });
                if (!res.ok) {
                    let detail = '업로드 실패';
                    try {
                        const payload = await res.json();
                        detail = payload.detail || detail;
                    } catch (e) {}
                    renderUploadStatus(detail, true);
                    return;
                }
                const data = await res.json();
                if (!uploadedFiles.includes(data.filename)) uploadedFiles.push(data.filename);
            }
            renderUploadStatus('문서 업로드 완료', false);
            if (input) input.value = '';
        });
        document.getElementById('startBtn').addEventListener('click', async function () {
            const question = (document.getElementById('question').value || '').trim();
            const contextNote = document.getElementById('contextNote').value || '';
            if (!question) return;
            if (!getStoredToken()) {
                setAuthMessage('분석 run 생성에는 로그인이 필요합니다.', true);
                return;
            }
            const res = await fetch('/modules/research_assistant/runs', {
                method: 'POST',
                headers: authHeaders({ 'Content-Type': 'application/json' }),
                body: JSON.stringify({
                    question: question,
                    context_note: contextNote,
                    temp_session_id: uploadSessionId
                })
            });
            if (!res.ok) {
                let detail = '분석 run 생성 실패';
                try {
                    const payload = await res.json();
                    detail = payload.detail || detail;
                } catch (e) {}
                if (res.status === 401) {
                    setAuthMessage(detail || '로그인이 필요합니다.', true);
                }
                renderUploadStatus(detail, true);
                return;
            }
            const data = await res.json();
            window.location.href = '/user-console?run_id=' + encodeURIComponent(data.run_id);
        });
        document.getElementById('loginBtn').addEventListener('click', login);
        document.getElementById('loginPassword').addEventListener('keydown', function (event) {
            if (event.key === 'Enter') login();
        });
        updateAuthUI();
    </script>
</body>
</html>
