<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Workflow Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
    <div class="max-w-4xl mx-auto px-6 py-10">
        <a href="/ui" class="text-sm text-fuchsia-300 hover:text-fuchsia-200">Home</a>
        <h1 class="text-3xl font-semibold mt-4">AI Workflow Console</h1>
        <p class="text-slate-400 mt-2">이미지/비디오/생성 작업 run을 시작합니다.</p>
        <div class="mt-6 rounded-3xl border border-white/10 bg-slate-900/60 p-6 space-y-4">
            <select id="taskType" class="w-full rounded-2xl bg-slate-950/70 border border-white/10 px-4 py-3 text-sm">
                <option value="image">image</option>
                <option value="video">video</option>
                <option value="generation">generation</option>
            </select>
            <textarea id="prompt" rows="6" class="w-full rounded-2xl bg-slate-950/70 border border-white/10 px-4 py-3 text-sm" placeholder="무엇을 생성할지 적어주세요."></textarea>
            <button id="startBtn" class="px-5 py-3 rounded-xl bg-fuchsia-400 text-slate-950 font-medium hover:bg-fuchsia-300">Start Workflow Run</button>
        </div>
    </div>
    <script>
        function authHeaders(extra) {
            const token = localStorage.getItem('authToken');
            const headers = Object.assign({}, extra || {});
            if (token) headers['Authorization'] = 'Bearer ' + token;
            return headers;
        }
        document.getElementById('startBtn').addEventListener('click', async function () {
            const taskType = document.getElementById('taskType').value;
            const prompt = (document.getElementById('prompt').value || '').trim();
            if (!prompt) return;
            const res = await fetch('/modules/ai_workflow_console/runs', {
                method: 'POST',
                headers: authHeaders({ 'Content-Type': 'application/json' }),
                body: JSON.stringify({ task_type: taskType, prompt: prompt })
            });
            if (!res.ok) return;
            const data = await res.json();
            window.location.href = '/user-console?run_id=' + encodeURIComponent(data.run_id);
        });
    </script>
</body>
</html>
