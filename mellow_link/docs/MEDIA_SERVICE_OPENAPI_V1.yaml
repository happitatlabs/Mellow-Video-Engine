openapi: 3.0.3
info:
  title: Media Service API
  version: "1.0.0-draft"
  description: |
    Image/Video engine separation contract for an external media service.

    Design goals:
    - Core runtime is media-off by default.
    - Core talks to media-service only through HTTP.
    - Local filesystem paths are not part of the contract.
    - Artifacts are exchanged via upload, storage reference, or download URL.
    - Long-running media work uses job-based APIs.

servers:
  - url: https://media.internal.example
    description: Internal media service

tags:
  - name: Capability
  - name: Health
  - name: Artifacts
  - name: Artifact Tickets
  - name: Image Jobs
  - name: Video Jobs
  - name: Jobs
  - name: Callbacks

security:
  - bearerAuth: []

paths:
  /capabilities:
    get:
      tags: [Capability]
      summary: Get media service capabilities
      operationId: getCapabilities
      responses:
        "200":
          description: Capability response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

  /health:
    get:
      tags: [Health]
      summary: Liveness and readiness check
      operationId: getHealth
      responses:
        "200":
          description: Health response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

  /v1/artifacts:
    post:
      tags: [Artifacts]
      summary: Upload an input artifact
      operationId: uploadArtifact
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                kind:
                  type: string
                  enum: [input, image, video, audio]
                  default: input
                source_filename:
                  type: string
                  example: input.png
                checksum_sha256:
                  type: string
                  example: 8f434346648f6b96df89dda901c5176b10a6d83961e2d5177a3d2b6f1d45abcd
      responses:
        "201":
          description: Artifact uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactUploadResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "413":
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

  /v1/artifacts/upload-ticket:
    post:
      tags: [Artifact Tickets]
      summary: Issue a presigned upload ticket for artifact storage
      operationId: createArtifactUploadTicket
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactUploadTicketRequest"
      responses:
        "201":
          description: Upload ticket issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactUploadTicketResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

  /v1/artifacts/{artifact_id}:
    get:
      tags: [Artifacts]
      summary: Get artifact metadata
      operationId: getArtifact
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
      responses:
        "200":
          description: Artifact metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /v1/artifacts/{artifact_id}/download-ticket:
    post:
      tags: [Artifact Tickets]
      summary: Issue a short-lived download ticket for an artifact
      operationId: createArtifactDownloadTicket
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
      responses:
        "201":
          description: Download ticket issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactDownloadTicketResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /v1/image-jobs:
    post:
      tags: [Image Jobs]
      summary: Submit an image generation job
      operationId: createImageJob
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageJobRequest"
      responses:
        "202":
          description: Image job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAcceptedResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "409":
          description: Duplicate idempotency key with conflicting payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/QueueFullError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

  /v1/video-jobs:
    post:
      tags: [Video Jobs]
      summary: Submit a video generation job
      operationId: createVideoJob
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoJobRequest"
      responses:
        "202":
          description: Video job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAcceptedResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Input artifact not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Duplicate idempotency key with conflicting payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/QueueFullError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

  /v1/jobs/{job_id}:
    get:
      tags: [Jobs]
      summary: Get job status
      operationId: getJob
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatusResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /v1/jobs/{job_id}/result:
    get:
      tags: [Jobs]
      summary: Get final job result
      operationId: getJobResult
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResultResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          description: Job not completed yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/jobs/{job_id}/cancel:
    post:
      tags: [Jobs]
      summary: Cancel a queued or running job
      operationId: cancelJob
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Cancel result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelJobResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          description: Job cannot be cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /callbacks/job-events:
    post:
      tags: [Callbacks]
      summary: Reference callback endpoint for job lifecycle webhooks
      description: |
        This path is not hosted by media-service. It documents the callback
        contract that media-service sends to core or another upstream consumer.
      operationId: jobEventCallback
      security: []
      parameters:
        - $ref: "#/components/parameters/CallbackSignatureHeader"
        - $ref: "#/components/parameters/CallbackTimestampHeader"
        - $ref: "#/components/parameters/EventIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobEventCallback"
      responses:
        "200":
          description: Callback acknowledged
        "202":
          description: Callback accepted for async handling
        "400":
          description: Invalid callback payload or signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    RequestIdHeader:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
      description: Optional request correlation id from core service
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
      description: Prevents duplicate submit on retry
    CallbackSignatureHeader:
      name: X-Media-Signature
      in: header
      required: true
      schema:
        type: string
      description: HMAC signature of callback payload
    CallbackTimestampHeader:
      name: X-Media-Timestamp
      in: header
      required: true
      schema:
        type: string
      description: Unix timestamp used in callback signing
    EventIdHeader:
      name: X-Event-Id
      in: header
      required: true
      schema:
        type: string
      description: Unique event id for callback de-duplication
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        example: img_job_001
    ArtifactId:
      name: artifact_id
      in: path
      required: true
      schema:
        type: string
        example: art_img_001

  responses:
    UnauthorizedError:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFoundError:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailableError:
      description: Media service or dependency unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    QueueFullError:
      description: Queue is full
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    CapabilityResponse:
      type: object
      required: [service, healthy, features, version]
      properties:
        service:
          type: string
          example: media-service
        healthy:
          type: boolean
        features:
          $ref: "#/components/schemas/FeatureFlags"
        version:
          type: string
          example: 1.0.0

    FeatureFlags:
      type: object
      required: [image_generation, video_generation, video_postprocess]
      properties:
        image_generation:
          type: boolean
        video_generation:
          type: boolean
        video_postprocess:
          type: boolean

    HealthResponse:
      type: object
      required: [healthy, components, timestamp]
      properties:
        healthy:
          type: boolean
        components:
          type: object
          required: [comfyui, storage, ffmpeg]
          properties:
            comfyui:
              type: boolean
            storage:
              type: boolean
            ffmpeg:
              type: boolean
        timestamp:
          type: string
          format: date-time

    ArtifactRef:
      type: object
      required: [artifact_id]
      properties:
        artifact_id:
          type: string
          example: art_img_001

    StorageProvider:
      type: string
      enum: [s3, gcs, azure_blob, internal_http]

    StorageRef:
      type: object
      required: [storage_provider, object_key]
      properties:
        storage_provider:
          $ref: "#/components/schemas/StorageProvider"
        bucket:
          type: string
          nullable: true
        container:
          type: string
          nullable: true
        object_key:
          type: string
        signed_url:
          type: string
          format: uri
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true

    Artifact:
      type: object
      required:
        - artifact_id
        - kind
        - filename
        - content_type
        - size_bytes
        - checksum_sha256
        - created_at
      properties:
        artifact_id:
          type: string
        kind:
          type: string
          enum: [input, image, video, audio, thumbnail]
        filename:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        checksum_sha256:
          type: string
        created_at:
          type: string
          format: date-time
        download_url:
          type: string
          format: uri
          nullable: true
        storage_ref:
          $ref: "#/components/schemas/StorageRef"

    ArtifactUploadResponse:
      type: object
      required: [success, artifact]
      properties:
        success:
          type: boolean
          example: true
        artifact:
          $ref: "#/components/schemas/Artifact"

    ArtifactUploadTicketRequest:
      type: object
      required: [kind, content_type, size_bytes]
      properties:
        kind:
          type: string
          enum: [input, image, video, audio]
        content_type:
          type: string
          example: image/png
        size_bytes:
          type: integer
          format: int64
        source_filename:
          type: string
          nullable: true
        checksum_sha256:
          type: string
          nullable: true

    ArtifactUploadTicketResponse:
      type: object
      required: [success, artifact_id, upload]
      properties:
        success:
          type: boolean
        artifact_id:
          type: string
        upload:
          $ref: "#/components/schemas/PresignedUpload"

    ArtifactDownloadTicketResponse:
      type: object
      required: [success, artifact_id, download]
      properties:
        success:
          type: boolean
        artifact_id:
          type: string
        download:
          $ref: "#/components/schemas/PresignedDownload"

    PresignedUpload:
      type: object
      required: [method, url, expires_at]
      properties:
        method:
          type: string
          enum: [PUT, POST]
        url:
          type: string
          format: uri
        headers:
          type: object
          additionalProperties:
            type: string
        form_fields:
          type: object
          additionalProperties:
            type: string
        expires_at:
          type: string
          format: date-time
        storage_ref:
          $ref: "#/components/schemas/StorageRef"

    PresignedDownload:
      type: object
      required: [method, url, expires_at]
      properties:
        method:
          type: string
          enum: [GET]
        url:
          type: string
          format: uri
        headers:
          type: object
          additionalProperties:
            type: string
        expires_at:
          type: string
          format: date-time

    SubmitOptions:
      type: object
      properties:
        priority:
          type: string
          enum: [low, normal, high]
          default: normal
        callback:
          $ref: "#/components/schemas/CallbackConfig"
        callback_url:
          type: string
          format: uri
          nullable: true
          deprecated: true
        session_id:
          type: string
          nullable: true
        client_tags:
          type: object
          additionalProperties:
            type: string

    CallbackConfig:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
        secret_id:
          type: string
          nullable: true
          description: Identifier for shared secret material; secret value is never returned
        events:
          type: array
          items:
            $ref: "#/components/schemas/JobEventType"
        timeout_seconds:
          type: integer
          default: 5
        max_retries:
          type: integer
          default: 3

    ImageJobRequest:
      type: object
      required: [prompt]
      properties:
        request_id:
          type: string
          example: req_123
        prompt:
          type: string
          example: cinematic portrait of a silver-haired woman
        negative_prompt:
          type: string
          nullable: true
          example: blurry, low quality
        width:
          type: integer
          default: 1216
        height:
          type: integer
          default: 704
        steps:
          type: integer
          default: 20
        cfg_scale:
          type: number
          format: float
          default: 7.0
        seed:
          type: integer
          default: -1
        model:
          type: string
          nullable: true
          example: flux1-dev-fp8.safetensors
        output:
          $ref: "#/components/schemas/OutputPreferences"
        options:
          $ref: "#/components/schemas/SubmitOptions"

    VideoJobRequest:
      type: object
      required: [input]
      properties:
        request_id:
          type: string
          example: req_124
        input:
          $ref: "#/components/schemas/VideoInputRef"
        motion_prompt:
          type: string
          nullable: true
          example: subtle camera push-in, hair moving softly
        prompt:
          type: string
          nullable: true
        motion_bucket_id:
          type: integer
          minimum: 0
          maximum: 255
          default: 127
        target_duration:
          type: number
          format: float
          default: 12.0
        loop_mode:
          type: string
          enum: [boomerang, crossfade]
          default: boomerang
        overlap_seconds:
          type: number
          format: float
          default: 0.35
        fps:
          type: integer
          default: 8
        output:
          $ref: "#/components/schemas/OutputPreferences"
        options:
          $ref: "#/components/schemas/SubmitOptions"

    VideoInputRef:
      oneOf:
        - $ref: "#/components/schemas/ArtifactRef"
        - $ref: "#/components/schemas/StorageRef"

    OutputPreferences:
      type: object
      properties:
        return_download_urls:
          type: boolean
          default: true
        return_storage_refs:
          type: boolean
          default: true
        retention_hours:
          type: integer
          nullable: true
        preferred_container:
          type: string
          nullable: true

    JobAcceptedResponse:
      type: object
      required: [success, job_id, status]
      properties:
        success:
          type: boolean
          example: true
        job_id:
          type: string
          example: img_job_001
        status:
          $ref: "#/components/schemas/JobStatus"

    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]

    JobType:
      type: string
      enum: [image, video]

    JobStatusResponse:
      type: object
      required: [job_id, type, status, created_at, updated_at]
      properties:
        job_id:
          type: string
        type:
          $ref: "#/components/schemas/JobType"
        status:
          $ref: "#/components/schemas/JobStatus"
        progress:
          type: number
          format: float
          nullable: true
          example: 42.5
        stage:
          type: string
          nullable: true
          example: comfy_execution
        request_id:
          type: string
          nullable: true
        submitted_by:
          type: string
          nullable: true
        callback_state:
          $ref: "#/components/schemas/CallbackDeliveryState"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    JobMetrics:
      type: object
      properties:
        generation_time_ms:
          type: number
          format: float
        postprocess_time_ms:
          type: number
          format: float
          nullable: true

    JobResultResponse:
      type: object
      required: [job_id, type, status]
      properties:
        job_id:
          type: string
        type:
          $ref: "#/components/schemas/JobType"
        status:
          $ref: "#/components/schemas/JobStatus"
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/Artifact"
        metrics:
          $ref: "#/components/schemas/JobMetrics"
        metadata:
          type: object
          additionalProperties: true
        error:
          $ref: "#/components/schemas/ErrorBody"

    CancelJobResponse:
      type: object
      required: [success, job_id, status]
      properties:
        success:
          type: boolean
        job_id:
          type: string
        status:
          $ref: "#/components/schemas/JobStatus"

    CallbackDeliveryState:
      type: object
      properties:
        enabled:
          type: boolean
        last_delivery_at:
          type: string
          format: date-time
          nullable: true
        last_delivery_status:
          type: string
          nullable: true
        retry_count:
          type: integer
          nullable: true

    JobEventType:
      type: string
      enum:
        - job.queued
        - job.running
        - job.succeeded
        - job.failed
        - job.cancelled

    JobEventPayload:
      type: object
      required: [event_type, job_id, job_type, status, occurred_at]
      properties:
        event_type:
          $ref: "#/components/schemas/JobEventType"
        job_id:
          type: string
        request_id:
          type: string
          nullable: true
        job_type:
          $ref: "#/components/schemas/JobType"
        status:
          $ref: "#/components/schemas/JobStatus"
        progress:
          type: number
          format: float
          nullable: true
        stage:
          type: string
          nullable: true
        occurred_at:
          type: string
          format: date-time
        result:
          $ref: "#/components/schemas/JobResultResponse"
        error:
          $ref: "#/components/schemas/ErrorBody"

    JobEventCallback:
      type: object
      required: [event_id, delivery_id, payload]
      properties:
        event_id:
          type: string
        delivery_id:
          type: string
        payload:
          $ref: "#/components/schemas/JobEventPayload"

    ErrorCode:
      type: string
      enum:
        - MEDIA_DISABLED
        - SERVICE_UNAVAILABLE
        - VALIDATION_ERROR
        - INPUT_ARTIFACT_MISSING
        - INPUT_ARTIFACT_UNREADABLE
        - QUEUE_FULL
        - COMFYUI_UNAVAILABLE
        - FFMPEG_UNAVAILABLE
        - MEDIA_TIMEOUT
        - GENERATION_FAILED
        - POSTPROCESS_FAILED
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - CALLBACK_DELIVERY_FAILED
        - INVALID_CALLBACK_SIGNATURE

    ErrorBody:
      type: object
      required: [code, message, retryable]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        retryable:
          type: boolean
        details:
          type: object
          additionalProperties: true

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
