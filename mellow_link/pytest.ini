# Pytest config for mellow_link
# Run from repo root: python -m pytest mellow_link/tests ...
[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
# Markers: separate core-required (CI must pass) vs env-policy (environment/security policy dependent)
markers =
    core_required: Core behavior; CI should run and require pass (default for most tests).
    env_policy: Environment or security-policy dependent; may fail on some systems. Run optionally in CI.
